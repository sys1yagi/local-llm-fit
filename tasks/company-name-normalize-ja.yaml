name: company-name-normalize-ja
title: 取引先リストの社名表記を正規化する
description: |
  名寄せの前処理。「（株）」「㈱」などが混在した取引先リストを渡し、
  すべて「株式会社」に直した全文を返させる。
  難所は、前株・後株を入れ替えないこと。社名の本体だけを見て
  機械的に置き換えると、位置が変わって別の社名になってしまう。

generator:
  module: company_name_normalize_ja
  samples: 48
  seed: 42

request:
  temperature: 0
  # 上限は答えを切らないための安全弁。思考を先に吐くモデルは思考分もここから使う
  max_tokens: 4096

prompt: |
  次の取引先リストの社名の書き方を、下のルールにそろえて、全文をJSONで返してください。
  JSONだけを出力してください。

  ルール:
  1. 「（株）」「(株)」「㈱」は、すべて「株式会社」という漢字表記に直す
  2. 「株式会社」が社名の前にあるものは前のまま、後ろにあるものは後ろのままにする。
     位置を入れ替えない
  3. それ以外の文字は変えない。社名の本体・担当者名・並び順・行の形はそのまま

  キーは次のとおりにしてください。
  - text: 直したあとの全文（改行を含む文字列）

  {input}

schema:
  type: object
  required: [text]
  properties:
    text: {type: string}

# 採点。全文が正解と一致したら合格。
#
# collapse_whitespace: 空白と改行を落としてから比べる。
#   このタスクで測りたいのは法人格の表記と位置をそろえられるかどうかで、
#   空白の入れ方ではないため。改行の位置は比較に入らない。
grading:
  collapse_whitespace: true
  scalar_fields: [text]
  item_fields: []

# 「使える」と言える基準。仮置き。
# 入力が300字ほどで出力もほぼ同じ長さなので、既存の短い抽出タスクに合わせている。
# 書き換えは1字でも違えば不正解になるため、正答率の線は抽出より低めに置いた。
slo:
  pass_rate: 0.90      # 正しく直せた件数の割合
  ttft_p95_s: 2.0      # 最初の文字が出るまで（p95）
  e2e_p95_s: 20.0      # 返り終わるまで（p95）
  error_rate: 0.0      # 接続エラー・タイムアウトの割合
