name: expense-account-code-ja
# 生成器・採点・指示文のどれかを変えたら上げる（README「タスクのversion」）
version: 1
title: 経費申請に勘定科目を1つ付ける
description: |
  経理の仕訳。経費申請1件と社内規程を渡し、勘定科目を1語で返させる。
  難所は、摘要から連想するのではなく規程の条件を当てはめられるかどうか。
  飲食は同席者と1人あたりの金額で、物品は金額で科目が変わり、
  境目ちょうどの金額を混ぜてある。

generator:
  module: expense_account_code_ja
  samples: 48
  seed: 42

request:
  temperature: 0
  # 上限は答えを切らないための安全弁。思考を先に吐くモデルは思考分もここから使う
  max_tokens: 4096

prompt: |
  次の経費申請に、下の規程にしたがって勘定科目を1つ付けてください。
  JSONだけを出力してください。

  ［勘定科目の規程］
  1. 飲食の費用
     - 社外の同席がある場合、1人あたりの金額が5,000円を超えるなら「交際費」、
       5,000円以下なら「会議費」
     - 社外の同席がない場合は、金額にかかわらず「会議費」
  2. 交通機関の利用と出張の宿泊は「旅費交通費」
  3. 物品の購入は、1件10万円以上なら「備品費」、10万円未満なら「消耗品費」
  4. 電話・回線・郵送にかかるものは「通信費」
  5. 書籍と定期購読は「新聞図書費」
  6. 手数料と外部への報酬は「支払手数料」
  7. 広告の掲載と展示会の出展は「広告宣伝費」

  キーは次のとおりにしてください。
  - account: 勘定科目名（上の7つのいずれかの表記をそのまま使う）

  ［申請］
  {input}

schema:
  type: object
  required: [account]
  properties:
    account: {type: string}

# 採点。科目名が一致したら合格。
grading:
  collapse_whitespace: true
  scalar_fields: [account]
  item_fields: []

# 「使える」と言える基準。仮置き。
# 入力が100字ほど、出力も1語なので、いちばん軽い部類のタスクになる。
# 生成が短いぶん、同時本数を上げたときは順番待ちの影響が出やすい。
slo:
  pass_rate: 0.90      # 正しい科目を付けられた件数の割合
  ttft_p95_s: 2.0      # 最初の文字が出るまで（p95）
  e2e_p95_s: 8.0       # 返り終わるまで（p95）
  error_rate: 0.0      # 接続エラー・タイムアウトの割合
