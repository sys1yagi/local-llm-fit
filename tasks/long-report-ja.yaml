name: long-report-ja
title: 長い業務日報から、散らばった決定事項を拾ってJSONにする
description: |
  2万字ほどの業務日報のまとまりを渡し、その中に散らばっている6件の決定
  （金額・実施日・結論）を抜き出させる。答えは文書の離れた場所にあり、
  紛らわしい行（同じ案件の当初見積、無関係な案件の似た行）が混ざっている。

  invoice-json-ja が数百字の入力で「作る側」の速さを測るのに対し、
  こちらは入力が2万字あるので「読む側」の時間が支配的になる。
  同時本数を上げたときに最初の文字が出るまでの時間がどう壊れるかが、
  短い入力のときとは別の形になるはず、というのがこのタスクの狙い。

# 入力の作り方。実データは使わず、seed 固定で合成する。
# doc_chars を変えると入力の長さが変わる。将来「入力の長さ × 何本まで」を
# 掃引したくなったときは、ここだけ動かせばよい。
generator:
  module: long_report_ja
  samples: 48
  seed: 42
  doc_chars: 20000
  needles: 6

request:
  temperature: 0
  # 上限は答えを切らないための安全弁。思考を先に吐くモデルは思考分もここから使う
  max_tokens: 4096

prompt: |
  次の業務日報から、「対象の案件番号」に挙げた案件それぞれについて、
  最終的に決定した内容を抜き出し、JSONだけを出力してください。
  説明文やコードブロックの前後の文章は不要です。

  注意:
  - 抜き出すのは「最終決定額」「決定実施日」「審議の結論」です。
    「当初見積額」「見積時点の想定実施日」は答えではありません
  - items は「対象の案件番号」に並んでいる順番どおりにしてください

  キーは次のとおりにしてください。
  - items: 配列。各要素は
    - code: 案件番号（例 PRJ-1234）
    - amount: 最終決定額（円。カンマや「円」を含めない整数）
    - date: 決定実施日（YYYY-MM-DD の文字列）
    - status: 審議の結論（「承認」「条件付き承認」「差し戻し」のいずれか）

  {input}

# 出力の形。ここを満たさないものは即不正解。
schema:
  type: object
  required: [items]
  properties:
    items:
      type: array
      minItems: 1
      items:
        type: object
        required: [code, amount, date, status]
        properties:
          code: {type: string}
          amount: {type: integer}
          date: {type: string}
          status: {type: string}

# 採点。ここに挙げた項目がすべて正解と一致したら、そのサンプルは正解。
#
# collapse_whitespace: 文字列を比べる前に空白をすべて落とす。
#   このタスクで測りたいのは抜き出せているかどうかで、表記を揃えられるか
#   ではないので立てている。表記まで含めて合わせたい業務では外す（既定は外れている）。
grading:
  collapse_whitespace: true
  scalar_fields: []
  item_fields: [code, amount, date, status]

# 「使える」と言える基準。すべて仮置きで、根拠は下のとおり。
#
# ttft_p95_s: 2万字の読み込みが先に走るので、短い入力用の 2 秒は成り立たない。
#   Apple M5 Max + ornith-1.5-35b-a3b で同時1本を測ると 12.0 秒だった。
#   その2.5倍を仮の線にしている。人が待てる時間ではなく、
#   同時本数を上げたときにどこから崩れるかを見るための線。
# e2e_p95_s: 同じ条件の同時1本で 15.8 秒。その約3倍。
# pass_rate: 離れた場所にある6件を1つも落とさずに揃える必要があり、
#   1項目でも外れれば不正解になる。短い入力のタスクより低めに置いている。
#
# 実際に使うときは、この4つを業務の側から決め直すこと。
# 機材が変われば1本あたりの実測も変わるので、線も置き直しになる。
slo:
  pass_rate: 0.80      # 正しく抜き出せた件数の割合
  ttft_p95_s: 30.0     # 最初の文字が出るまで（p95）
  e2e_p95_s: 45.0      # 返り終わるまで（p95）
  error_rate: 0.0      # 接続エラー・タイムアウトの割合
