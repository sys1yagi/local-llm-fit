name: invoice-json-ja
title: 日本語の請求書から決められたJSONを抜き出す
description: |
  日本語の請求書テキストを渡し、決められたキーのJSONで返させる。
  合否は「JSONとして読めるか」「スキーマを満たすか」「値が正解と一致するか」の
  3つだけで決める。LLMに採点させない。

# 入力の作り方。実データは使わず、seed 固定で合成する。
# 同じ seed なら誰の手元でも同じ入力が出る。
#
# samples を少なくすると正答率が粗くなる。12件だと 11/12 = 91.7% の次が
# 12/12 = 100% で、その間の値が存在しない。下の 95% のような基準を使うなら
# 40件以上は要る。
generator:
  module: invoice_ja
  samples: 48
  seed: 42

request:
  temperature: 0
  # 上限は答えを切らないための安全弁。思考を先に吐くモデルは思考分もここから使う
  max_tokens: 4096

prompt: |
  次の請求書から情報を抽出し、JSONだけを出力してください。説明文やコードブロックの前後の文章は不要です。

  キーは次のとおりにしてください。
  - invoice_number: 請求書番号（文字列）
  - issue_date: 発行日（YYYY-MM-DD の文字列）
  - due_date: 支払期限（YYYY-MM-DD の文字列）
  - customer: 請求先の会社名（「御中」「様」は含めない）
  - items: 明細の配列。各要素は name（品名）, quantity（整数）, unit_price（整数）, amount（整数）
  - subtotal: 小計（整数）
  - tax: 消費税額（整数）
  - total: 合計金額（整数）

  金額は円で、カンマや「円」を含めない整数にしてください。

  請求書:
  ---
  {input}
  ---

# 出力の形。ここを満たさないものは即不合格。
schema:
  type: object
  required: [invoice_number, issue_date, due_date, customer, items, subtotal, tax, total]
  properties:
    invoice_number: {type: string}
    issue_date: {type: string}
    due_date: {type: string}
    customer: {type: string}
    subtotal: {type: integer}
    tax: {type: integer}
    total: {type: integer}
    items:
      type: array
      minItems: 1
      items:
        type: object
        required: [name, quantity, unit_price, amount]
        properties:
          name: {type: string}
          quantity: {type: integer}
          unit_price: {type: integer}
          amount: {type: integer}

# 採点。ここに挙げた項目がすべて正解と一致したら、そのサンプルは合格。
#
# collapse_whitespace: 文字列を比べる前に空白をすべて落とす。
#   「名刺印刷100枚」と「名刺印刷 100枚」を同じものとして扱う。
#   このタスクで測りたいのは抜き出せているかどうかで、表記を揃えられるか
#   ではないので立てている。表記まで含めて合わせたい業務では外す（既定は外れている）。
grading:
  collapse_whitespace: true
  scalar_fields: [invoice_number, issue_date, due_date, customer, subtotal, tax, total]
  item_fields: [name, quantity, unit_price, amount]

# 「使える」と言える基準。ここを書き換えるのが各社の仕事で、
# 下の数字は「社内の経理担当が数人で使う」想定の仮置きにすぎない。
slo:
  pass_rate: 0.95      # 正しく抽出できた件数の割合
  ttft_p95_s: 2.0      # 最初の文字が出るまで（p95）
  e2e_p95_s: 15.0      # 返り終わるまで（p95）
  error_rate: 0.0      # 接続エラー・タイムアウトの割合
