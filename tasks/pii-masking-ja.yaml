name: pii-masking-ja
# 生成器・採点・指示文のどれかを変えたら上げる（README「タスクのversion」）
version: 1
title: 議事録から個人情報を伏せて、それ以外は1字も変えずに返す
description: |
  社外に出す前の下処理。打合せメモや問い合わせ記録を渡し、氏名・電話番号・
  メールアドレス・住所だけを決まった伏せ字に置き換えた全文を返させる。
  難所は人名と社名の見分け。本文には「山下テクノ」のように人の姓で始まる
  社名と、同じ姓の人物が一緒に出てくる。名前らしい文字列をまとめて伏せると
  社名まで潰れ、伏せ足りなければ個人情報が残る。

generator:
  module: pii_masking_ja
  samples: 12
  seed: 411

request:
  temperature: 0
  # 上限は答えを切らないための安全弁。思考を先に吐くモデルは思考分もここから使う
  max_tokens: 4096

prompt: |
  次の記録から個人情報を伏せて、全文をJSONで返してください。
  JSONだけを出力してください。

  伏せ方:
  1. 人の氏名は `〔氏名〕` に置き換える。姓と名をまとめて1つの `〔氏名〕` にする。
     直後の「さん」「様」はそのまま残す
  2. 電話番号は `〔電話番号〕` に置き換える
  3. メールアドレスは `〔メールアドレス〕` に置き換える
  4. 住所は `〔住所〕` に置き換える。都道府県から番地まで、建物名と階が
     続く場合はそこまでを1つの `〔住所〕` にする
  5. 会社名・部署名・会議室名・日付・金額は伏せない。**会社名が人の姓で
     始まっていても、会社名なら伏せない**
  6. 上の5つ以外の文字は1字も変えない。行の並び順もそのまま

  キーは次のとおりにしてください。
  - text: 伏せたあとの全文（改行を含む文字列）

  {input}

schema:
  type: object
  required: [text]
  properties:
    text: {type: string}

# 採点。全文が正解と一致したら合格。
#
# collapse_whitespace: 空白と改行を落としてから比べる。
#   測りたいのは伏せる場所を選べるかどうかで、改行の入れ方ではないため。
grading:
  collapse_whitespace: true
  scalar_fields: [text]
  item_fields: []

# 「使える」と言える基準。仮置き。
# **「返り終わるまで」は特に仮置きで、実測がまだない。** このタスクは出力が
# 入力とほぼ同じ長さになり、書き写す量が他のタスクより多い。パイロットの実測を
# 見てから置き直す。
slo:
  pass_rate: 0.90      # 正しく伏せられた件数の割合
  ttft_p95_s: 3.0      # 最初の文字が出るまで（p95）
  e2e_p95_s: 40.0      # 返り終わるまで（p95）
  error_rate: 0.0      # 接続エラー・タイムアウトの割合
